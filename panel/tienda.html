      <div style="font-size:13px;margin-top:6px">${esc(p.items.map(i => `${i.cantidad}× ${i.nombre}`).join(', '))}</div>
      ${p.seguimiento ? `<div class="dir-acc"><button onclick="location.href='${esc(p.seguimiento)}'">Seguir pedido</button></div>` : ''}
    </div>`).join('')}</div>`
      : `<div class="vacio"><div class="ico">🧾</div><h3>Aún no tienes pedidos</h3><p>Cuando hagas uno, aquí lo verás.</p></div>`;
  }).catch(e => { $('cta-cuerpo').innerHTML = `<div class="vacio"><div class="ico">⚠️</div><h3>No pudimos cargar tus pedidos</h3><p>${esc(e.message)}</p></div>`; });
}

// ── Checkout con sesión ──
// Nombre y teléfono ya se conocen (el teléfono es el verificado y no se
// edita aquí); la dirección se ELIGE de la libreta o se escribe solo para
// este pedido. "Agregar nueva" desvía a la hoja de cuenta y regresa.
function elegirDireccion(id) { CK.direccionId = id; CK.otraDireccion = false; pintarPaso(); }
function escribirOtraDireccion() { CK.direccionId = null; CK.otraDireccion = true; pintarPaso(); }
function cambiarDireccionCheckout() { paso = PASOS.indexOf('datos'); pintarPaso(); }

function pasoDatosCliente() {
  const c = CUENTA.cliente, ds = CUENTA.direcciones || [];
  $('ck-titulo').textContent = CK.modalidad === 'domicilio' ? 'Entrega' : 'Tus datos';
  if (CK.modalidad === 'domicilio' && !CK.otraDireccion && !ds.some(d => d.id === CK.direccionId)) {
    CK.direccionId = (ds.find(d => d.predeterminada) || ds[0])?.id || null;
    if (!CK.direccionId) CK.otraDireccion = true;
  }
  const zonas = TIENDA.entrega.zonas || [];
  const otra = CK.modalidad === 'domicilio' && CK.otraDireccion;
  $('ck-cuerpo').innerHTML = `<div style="padding:16px 0">
    <div class="campo"><label for="ck-nombre">Nombre *</label>
      <input id="ck-nombre" value="${esc(CK.nombre || c.nombre || '')}" maxlength="80" autocomplete="name" placeholder="Tu nombre"></div>
    <div class="campo"><label>Teléfono</label>
      <div class="tel-fijo"><span>${esc(formatoTel(c.telefono))}</span><span class="badge abierto" style="font-size:11px">✓ verificado</span></div></div>
    ${CK.modalidad === 'domicilio' ? `
      <div class="campo" style="padding-bottom:6px"><label>Enviar a</label></div>
      ${ds.map(d => tarjetaDireccion(d, { seleccionable: true, activa: !otra && CK.direccionId === d.id })).join('')}
      <div class="dir-card${otra ? ' on' : ''}" role="button" id="ck-otra-dir" onclick="escribirOtraDireccion()">
        <div class="dir-alias">✏️ Escribir otra dirección</div>${otra ? '' : '<div class="dir-sub">Solo para este pedido</div>'}</div>
      <div style="padding:2px 16px 12px"><button class="enlace" id="ck-nueva-dir" onclick="abrirCuenta({vista:'direccion', volverAlCheckout:true})">+ Agregar nueva dirección</button></div>
      ${otra ? `<div class="campo"><label for="ck-dir">Dirección de entrega *</label>
          <textarea id="ck-dir" maxlength="240" autocomplete="street-address" placeholder="Calle, número, colonia y referencias">${esc(CK.direccion || '')}</textarea></div>
        ${zonas.length ? `<div class="campo"><label for="ck-zona">Zona *</label><select id="ck-zona"><option value="">Elige tu zona…</option>
            ${zonas.map(z => `<option value="${esc(z.nombre)}"${CK.zona === z.nombre ? ' selected' : ''}>${esc(z.nombre)} — ${dinero(z.costo)}</option>`).join('')}</select></div>`
          : `<div class="campo"><label for="ck-colonia">Colonia *</label><input id="ck-colonia" maxlength="120" value="${esc(CK.colonia || '')}" placeholder="Tu colonia"></div>`}` : ''}
    ` : ''}
    <div class="campo"><label for="ck-notas">Indicaciones para el negocio (opcional)</label>
      <textarea id="ck-notas" maxlength="240" placeholder="Timbre descompuesto, llamar al llegar…">${esc(CK.notas || '')}</textarea></div>
    <div id="ck-error-datos" class="campo oculto"><div class="malo" id="ck-error-datos-txt"></div></div>
  </div>`;
  $('ck-pie').innerHTML = `<button class="btn" onclick="validarDatosCliente()">Continuar</button>`;
}
function validarDatosCliente() {
  const c = CUENTA.cliente;
  const nombre = $('ck-nombre').value.trim();
  const errores = [];
  const marcar = (id, mal) => $(id)?.classList.toggle('error', mal);
  marcar('ck-nombre', nombre.length < 2); if (nombre.length < 2) errores.push('Escribe tu nombre');
  let direccion = '', zona = null, colonia = null, direccionId = null;
  if (CK.modalidad === 'domicilio') {
    if (CK.otraDireccion) {
      direccion = $('ck-dir')?.value.trim() || ''; zona = $('ck-zona')?.value || null; colonia = $('ck-colonia')?.value.trim() || null;
      marcar('ck-dir', direccion.length < 8); if (direccion.length < 8) errores.push('Necesitamos una dirección completa');
      if ($('ck-zona')) { marcar('ck-zona', !zona); if (!zona) errores.push('Elige tu zona de entrega'); }
      if ($('ck-colonia')) { marcar('ck-colonia', !colonia); if (!colonia) errores.push('Escribe tu colonia'); }
    } else {
      const d = (CUENTA.direcciones || []).find(x => x.id === CK.direccionId);
      if (!d) errores.push('Elige a qué dirección enviamos tu pedido');
      else { direccionId = d.id; zona = d.zona || null; colonia = d.colonia || null; direccion = d.resumen || d.calle; }
    }
  }
  if (errores.length) { $('ck-error-datos').classList.remove('oculto'); $('ck-error-datos-txt').textContent = errores.join(' · '); return; }
  Object.assign(CK, { nombre, telefono: c.telefono, direccion, zona, colonia, direccionId, notas: $('ck-notas').value.trim() });
  pasoAdelante();
}
function lineaDireccionResumen() {
  const guardada = CK.direccionId ? (CUENTA?.direcciones || []).find(d => d.id === CK.direccionId) : null;
  const texto = guardada ? `${esc(guardada.alias)} · ${esc(guardada.resumen || guardada.calle)}` : `${esc(CK.direccion)}${CK.colonia ? ', ' + esc(CK.colonia) : ''}`;
  const cambiar = CUENTA ? ` <button class="enlace" style="font-size:12.5px;margin-left:6px" onclick="cambiarDireccionCheckout()">Cambiar</button>` : '';
  return `<div>📍 ${texto}${cambiar}</div>`;
}
</script>
</body>
</html>
