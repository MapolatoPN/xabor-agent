<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Seguimiento de tu pedido</title>
<style>
:root{
  --marca:#111827; --fondo:#ffffff; --superficie:#ffffff; --superficie-2:#f9fafb;
  --texto:#111827; --texto-2:#6b7280; --texto-3:#9ca3af; --borde:#e5e7eb;
  --exito:#059669; --exito-bg:#ecfdf5; --error:#dc2626; --error-bg:#fef2f2;
  --r:14px; --safe-b:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root{--fondo:#0b0f19;--superficie:#151b28;--superficie-2:#1c2333;
    --texto:#f3f4f6;--texto-2:#9ca3af;--texto-3:#6b7280;--borde:#252d3d;
    --exito-bg:#052e23;--error-bg:#2d1214}
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--fondo);color:var(--texto);line-height:1.45;font-size:16px;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;padding:24px 16px calc(32px + var(--safe-b))}
.cab{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.logo{width:48px;height:48px;border-radius:12px;object-fit:cover;background:var(--superficie-2);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--marca)}
h1{font-size:17px;font-weight:800;margin:0;letter-spacing:-.01em}
.cab-sub{font-size:13px;color:var(--texto-2)}

.folio-caja{background:var(--superficie-2);border-radius:var(--r);padding:18px;text-align:center;margin-bottom:22px}
.folio-lbl{font-size:11.5px;font-weight:800;color:var(--texto-2);text-transform:uppercase;letter-spacing:.06em}
.folio{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:3px 0 0}
.folio-modo{font-size:13.5px;color:var(--texto-2);margin-top:5px}

/* Línea de tiempo vertical */
.linea-tiempo{position:relative;padding-left:34px;margin-bottom:24px}
.linea-tiempo::before{content:'';position:absolute;left:11px;top:11px;bottom:11px;width:2px;background:var(--borde)}
.etapa{position:relative;padding:0 0 22px}
.etapa:last-child{padding-bottom:0}
.etapa::before{content:'';position:absolute;left:-29px;top:2px;width:24px;height:24px;border-radius:50%;
  background:var(--fondo);border:2px solid var(--borde);z-index:1}
.etapa.cumplida::before{content:'✓';background:var(--exito);border-color:var(--exito);color:#fff;
  font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
.etapa.actual::before{background:var(--marca);border-color:var(--marca);content:'';
  box-shadow:0 0 0 5px color-mix(in srgb,var(--marca) 18%,transparent)}
.etapa-nom{font-size:15px;font-weight:700;color:var(--texto-3)}
.etapa.cumplida .etapa-nom,.etapa.actual .etapa-nom{color:var(--texto)}
.etapa.actual .etapa-nom{color:var(--marca)}
.etapa-sub{font-size:12.5px;color:var(--texto-2);margin-top:1px}

.tarjeta{border:1px solid var(--borde);border-radius:var(--r);padding:15px;margin-bottom:14px;background:var(--superficie)}
.tarjeta h2{font-size:12.5px;font-weight:800;color:var(--texto-2);text-transform:uppercase;
  letter-spacing:.05em;margin:0 0 10px}
.item{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;gap:12px}
.item span:first-child{color:var(--texto-2)}
.total{display:flex;justify-content:space-between;font-size:17px;font-weight:800;
  padding-top:11px;margin-top:8px;border-top:1px solid var(--borde)}
.aviso{padding:13px;border-radius:var(--r);font-size:14px;font-weight:600;margin-bottom:16px;
  display:flex;gap:9px;align-items:flex-start}
.aviso.error{background:var(--error-bg);color:var(--error)}
.aviso.exito{background:var(--exito-bg);color:var(--exito)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--marca);
  color:#fff;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:12px}
.btn:disabled{opacity:.55;cursor:default}
.aviso.pago{background:var(--superficie-2);display:block}
.pago-err{font-size:13px;color:var(--error);margin-top:8px}
.pago-err:empty{display:none}
.importe-pago{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:10px;font-variant-numeric:tabular-nums}
.por-proveedor{font-size:13px;font-weight:400;color:var(--texto-2);margin-top:4px}
.enlace{display:block;width:100%;background:none;border:0;padding:12px 0 2px;font:inherit;font-size:13.5px;
  font-weight:600;color:var(--texto-2);text-decoration:underline;cursor:pointer;text-align:center}
.enlace:disabled{opacity:.6;cursor:default}
.vacio{padding:70px 24px;text-align:center;color:var(--texto-2)}
.vacio .ico{font-size:42px;margin-bottom:14px;opacity:.5}
.vacio h3{font-size:17px;color:var(--texto);margin:0 0 6px}
.pie{text-align:center;font-size:11.5px;color:var(--texto-3);margin-top:28px}
.actualizado{text-align:center;font-size:12px;color:var(--texto-3);margin-top:16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"><div class="vacio">Cargando tu pedido…</div></div>
<!-- Google Analytics 4 del negocio (solo si configuró su ID). Misma huella que
     en tienda.html; fase-tienda-ga4 la exige. -->
<script src="/tienda-analytics.js?v=b37c8239"></script>
<script>
'use strict';
const TOKEN = (location.pathname.match(/\/seguimiento\/([^/?#]+)/) || [])[1] || '';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dinero = n => '$' + (Number(n) || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

let ultimaEtapa = null;
// Estado de pago (solo memoria; nada financiero se guarda en el navegador).
// El GET es de SOLO LECTURA y jamás crea enlaces. El POST de pago solo ocurre
// cuando el cliente toca "Pagar", y el de verificar solo le pide al servidor
// que le pregunte a Clip por ESTE pedido; el servidor decide todo lo demás.
let PAGO = null;
let consultarPago = true;
let TOTAL = null;
// Lo último que el servidor supo de Clip para este pedido al verificar:
// 'pagado' | 'pendiente' | 'vencido' | 'sin_respuesta' | 'revision' | null.
let CONSULTA = null;
let ultimaVerificacion = 0;
const API_PAGO = '/api/tienda/seguimiento/' + encodeURIComponent(TOKEN) + '/pago';
const NOMBRES_PROVEEDOR = { clip: 'Clip', mercado_pago: 'Mercado Pago' };

// Retorno desde la pasarela (?retorno=pago en la URL que la pasarela usa
// para regresar) y POR CUÁL salida volvió (&r=exito | error | salida, las
// tres URLs de Clip). Es SOLO presentación: nada de esto autoriza un pago ni
// sustituye la verificación del servidor.
//   · exito (o un retorno viejo sin `r`): VENTANA DE VERIFICACIÓN de 2 min.
//     "Estamos verificando tu pago…", sin botón de pagar (evita un doble
//     intento) y sondeo cada 5 s, pidiéndole al servidor que consulte a Clip.
//   · error / salida: el cliente NO terminó de pagar. Se consulta a Clip una
//     vez y, si sigue pendiente, se ofrece reintentar de inmediato el MISMO
//     checkout, sin esperar a que se agote ninguna ventana.
const PARAMS = new URLSearchParams(location.search);
const RETORNO_PAGO = PARAMS.get('retorno') === 'pago';
const SALIDA = RETORNO_PAGO ? (['exito', 'error', 'salida'].includes(PARAMS.get('r')) ? PARAMS.get('r') : 'exito') : null;
const VERIFICACION_HASTA = RETORNO_PAGO && SALIDA === 'exito' ? Date.now() + 2 * 60 * 1000 : 0;
const enVentanaVerificacion = () =>
  Date.now() < VERIFICACION_HASTA && !!(PAGO && PAGO.esperandoPago);
// Al volver de la pasarela, el servidor le pregunta a Clip (con tope de
// frecuencia del lado del servidor). Fuera del retorno solo se consulta la
// base, salvo que el cliente toque "Verificar mi pago".
const toca = () => RETORNO_PAGO && (!ultimaVerificacion || (enVentanaVerificacion() && Date.now() - ultimaVerificacion > 9000));

async function consultarEstadoPago({ verificar = false } = {}) {
  const rp = verificar
    ? await fetch(API_PAGO + '/verificar', { method: 'POST' })
    : await fetch(API_PAGO);
  if (!rp.ok) return;
  const p = await rp.json();
  if (verificar) {
    ultimaVerificacion = Date.now();
    if (p.consulta && p.consulta !== 'omitida') CONSULTA = p.consulta;
  }
  PAGO = p;
}

async function cargar() {
  try {
    const r = await fetch('/api/tienda/seguimiento/' + encodeURIComponent(TOKEN));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Pedido no encontrado');
    TOTAL = Number(d.total) || 0;
    if (consultarPago) {
      try {
        const esperaba = !PAGO || PAGO.esperandoPago;
        // Primero la verificación con Clip (si toca), y si esa falla, la
        // lectura simple: el seguimiento nunca depende de que Clip conteste.
        if (esperaba && toca()) await consultarEstadoPago({ verificar: true }).catch(() => {});
        if (!PAGO || Date.now() - ultimaVerificacion > 1000) await consultarEstadoPago();
        // Un pedido que se paga en persona no tiene nada que consultar aquí;
        // uno ya pagado tampoco: se conserva el último estado y se deja de
        // preguntar.
        if (PAGO && !PAGO.esperandoPago) consultarPago = false;
      } catch (e) { /* la falla de esta consulta no tumba el seguimiento */ }
    }
    actualizarReferenciaLocal(d);
    pintar(d);
    // Analítica (GA4): carga gtag.js solo si el negocio tiene ID y reporta el
    // purchase de un pago en línea en cuanto el servidor lo confirma. No-op
    // si el módulo no cargó; nunca interrumpe el seguimiento.
    try { window.XaborAnalytics?.seguimiento(TOKEN); } catch (e) {}
    // Sondeo suave: el pedido cambia de estado en minutos, no en segundos.
    // Se detiene solo cuando ya no hay nada más que esperar. En la ventana
    // de verificación post-pasarela se acelera a 5 s para que "¡Pedido
    // confirmado!" aparezca en cuanto el servidor asiente el pago.
    if (!d.cancelado && d.etapaActual !== 'entregado') {
      setTimeout(cargar, enVentanaVerificacion() ? 5000 : 25000);
    }
  } catch (e) {
    $('app').innerHTML = `<div class="vacio"><div class="ico">🔍</div>
      <h3>No encontramos ese pedido</h3>
      <p>La liga puede estar incompleta o el pedido ya no está disponible.<br>
      Contacta al negocio con tu número de folio.</p></div>`;
  }
}

// ── Pago en línea ─────────────────────────────────────────────────────────
// Estados que pinta esta caja (la autoridad es SIEMPRE el servidor; `r` de la
// URL solo elige el texto):
//   esperando + pendiente/null        → "Tu pedido está listo para pagar" → [Pagar $X con Clip]
//   esperando + pagado                → "Estamos confirmando tu pago…"
//   esperando + requiere_revision     → "Estamos verificando tu pago."
//   esperando + vencido               → venció → [Generar nuevo enlace]
//   regreso por éxito, en la ventana  → "Estamos verificando tu pago…" (sin botón)
//   regreso por error / salida        → "No se completó el pago" → [Pagar $X con Clip]
//   ya no espera + pagado             → "Pago confirmado"
//   cancelado + vencido               → aviso de enlace vencido
const nombreProveedor = p => NOMBRES_PROVEEDOR[p?.proveedor] || null;
function textoPagar(p) {
  const n = nombreProveedor(p);
  return n && TOTAL ? `Pagar ${dinero(TOTAL)} con ${n}` : 'Pagar ahora';
}
function botonesPago(p, etiqueta) {
  // "Verifica tu pago" solo con Clip: es el único proveedor que el servidor
  // sabe consultar por pedido (el resto se concilia por su webhook).
  return `<button class="btn" id="btn-pagar" onclick="pagarAhora()">${esc(etiqueta || textoPagar(p))}</button>
      ${p?.proveedor === 'clip' ? '<button class="enlace" id="btn-verificar" onclick="verificarAhora()">¿Ya pagaste? Verifica tu pago</button>' : ''}
      <div class="pago-err" id="pago-err"></div>`;
}
function cajaPago(p, cancelado) {
  if (!p) return '';
  const nombre = nombreProveedor(p);
  const procesado = nombre ? `<div class="por-proveedor">🔒 Pago procesado por ${esc(nombre)}</div>` : '';
  if (p.esperandoPago) {
    if (p.pagoEstado === 'pagado') {
      return `<div class="aviso pago">⏳ <strong>Estamos confirmando tu pago…</strong><br>
        <span style="font-weight:400;color:var(--texto-2)">En cuanto quede confirmado, tu pedido pasará a preparación.</span></div>`;
    }
    if (p.pagoEstado === 'requiere_revision') {
      return `<div class="aviso pago">🔎 <strong>Estamos verificando tu pago.</strong><br>
        <span style="font-weight:400;color:var(--texto-2)">Si tienes dudas, contacta al negocio con tu folio.</span></div>`;
    }
    const vencido = p.pagoEstado === 'vencido';
    // Recién de vuelta de la pasarela por la salida de ÉXITO: el cliente
    // probablemente YA pagó y el servidor todavía verifica. "Verificando" (no
    // "confirmado": eso solo lo dice el servidor) y sin botón de pagar para no
    // invitar a un doble intento. Si Clip contesta que el checkout sigue sin
    // pagar, la ventana deja de esconder el reintento. Si venció, manda el
    // estado real, no la ventana.
    if (!vencido && enVentanaVerificacion() && CONSULTA !== 'pendiente') {
      return `<div class="aviso pago">🔎 <strong>Estamos verificando tu pago…</strong><br>
        <span style="font-weight:400;color:var(--texto-2)">Esto puede tardar unos segundos. No vuelvas a pagar.</span></div>`;
    }
    if (vencido) {
      return `<div class="aviso pago">⚠️ <strong>El enlace de pago venció.</strong>
      ${botonesPago(p, 'Generar nuevo enlace')}
    </div>`;
    }
    const [titulo, detalle] = SALIDA === 'error'
      ? ['No se pudo completar el pago', 'El pago no se aprobó. Puedes intentarlo de nuevo, por ejemplo con otra tarjeta.']
      : SALIDA === 'salida' || (SALIDA === 'exito' && CONSULTA === 'pendiente')
        ? ['No se completó el pago', 'Tu pedido sigue apartado. Puedes volver a intentarlo.']
        : ['Tu pedido está listo para pagar', 'Falta completar tu pago para confirmar el pedido.'];
    return `<div class="aviso pago">💳 <strong>${titulo}</strong><br><span style="font-weight:400;color:var(--texto-2)">${detalle}</span>
      ${TOTAL ? `<div class="importe-pago">${dinero(TOTAL)}</div>` : ''}${procesado}
      ${botonesPago(p)}
    </div>`;
  }
  if (p.pagoEstado === 'pagado' && !cancelado) {
    return `<div class="aviso exito">✓ <div><strong>Pago confirmado</strong><br>
      <span style="font-weight:400">Recibimos tu pago correctamente.</span></div></div>`;
  }
  if (cancelado && p.pagoEstado === 'vencido') {
    return `<div class="aviso error">⚠️ <div>El enlace de pago venció y el pedido no se completó.</div></div>`;
  }
  return '';
}

let pagando = false;
async function pagarAhora() {
  if (pagando) return;
  pagando = true;
  const b = $('btn-pagar');
  const etiqueta = b ? b.textContent : '';
  if (b) { b.disabled = true; b.textContent = 'Abriendo el pago…'; }
  try {
    const r = await fetch(API_PAGO, { method: 'POST' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'No pudimos consultar el pago');
    // El checkout embebido (si el negocio lo tiene) y la liga de Clip son el
    // MISMO checkout: la página propia solo lo presenta sin salir de Xabor.
    if (d.embebido && d.embebido.pagina) { location.href = d.embebido.pagina + '?abrir=1'; return; }
    if (d.url) { location.href = d.url; return; }
    // Sin URL: el pedido ya no espera pago, el enlace está en revisión o el
    // servidor todavía verifica un pago anterior. En todos los casos la verdad
    // está en la base: se vuelve a cargar.
    pagando = false;
    consultarPago = true;
    cargar();
  } catch (e) {
    pagando = false;
    if (b) { b.disabled = false; b.textContent = etiqueta || 'Pagar ahora'; }
    const err = $('pago-err');
    if (err) err.textContent = 'No pudimos consultar el pago. Intenta nuevamente.';
  }
}

// "¿Ya pagaste?": le pide al servidor que le pregunte a Clip por este pedido.
// No decide nada aquí: lo que conteste el servidor es lo que se pinta.
async function verificarAhora() {
  const b = $('btn-verificar');
  if (b) { b.disabled = true; b.textContent = 'Verificando…'; }
  try {
    await consultarEstadoPago({ verificar: true });
    if (PAGO && !PAGO.esperandoPago) consultarPago = false;
    const r = await fetch('/api/tienda/seguimiento/' + encodeURIComponent(TOKEN));
    if (r.ok) pintar(await r.json());
  } catch (e) { /* se queda lo último que se sabe; el sondeo sigue */ }
  const err = $('pago-err');
  if (err && PAGO && PAGO.esperandoPago && PAGO.pagoEstado !== 'pagado') {
    err.textContent = CONSULTA === 'pendiente' ? 'Clip todavía no registra tu pago.'
      : 'Aún no tenemos respuesta de Clip. Si ya pagaste, no vuelvas a pagar: verifica en un momento.';
  }
  const b2 = $('btn-verificar');
  if (b2 && b2.disabled) { b2.disabled = false; b2.textContent = '¿Ya pagaste? Verifica tu pago'; }
}

// ── Acceso local al pedido (por negocio) ─────────────────────────────────
// La tienda guarda `xabor_pedido_pendiente_<slug>` con el token del pedido por
// pagar para poder retomarlo. Aquí se actualiza la entrada de ESTE token: se
// marca pagado cuando el servidor lo confirma y se borra cuando el pedido ya
// terminó o dejó de ser recuperable. Nada financiero, solo el token y el folio.
function actualizarReferenciaLocal(d) {
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i) || '';
      if (!k.startsWith('xabor_pedido_pendiente_')) continue;
      let v = null;
      try { v = JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { v = null; }
      if (!v || v.token !== TOKEN) continue;
      if (d.cancelado || d.etapaActual === 'entregado') localStorage.removeItem(k);
      else if (PAGO && !PAGO.esperandoPago && !v.pagado) localStorage.setItem(k, JSON.stringify({ ...v, pagado: true }));
    }
  } catch (e) { /* almacenamiento bloqueado: el seguimiento funciona igual */ }
}

function pintar(d) {
  if (d.color) document.documentElement.style.setProperty('--marca', d.color);
  document.title = `Pedido #${d.folio} — ${d.negocio}`;
  ultimaEtapa = d.etapaActual;

  const sub = d.modalidad === 'domicilio' ? '🛵 Entrega a domicilio' : '🏪 Recoger en tienda';
  $('app').innerHTML = `
    <div class="cab">
      ${d.logo ? `<img class="logo" src="${esc(d.logo)}" alt="">`
               : `<div class="logo">${esc((d.negocio || '?').charAt(0).toUpperCase())}</div>`}
      <div><h1>${esc(d.negocio)}</h1><div class="cab-sub">Seguimiento de tu pedido</div></div>
    </div>

    <div class="folio-caja">
      <div class="folio-lbl">Folio</div>
      <div class="folio">#${esc(d.folio)}</div>
      <div class="folio-modo">${sub}</div>
    </div>

    ${cajaPago(PAGO, d.cancelado)}

    ${d.cancelado
      ? `<div class="aviso error">⚠️ <div>Este pedido fue cancelado. Si crees que es un error, comunícate con el negocio.</div></div>`
      : d.etapaActual === 'entregado'
        ? `<div class="aviso exito">✓ <div>¡Tu pedido fue entregado! Gracias por tu compra.</div></div>` : ''}

    ${d.programadoPara ? `<div class="aviso" style="background:var(--superficie-2)">📅
      <div>Programado para <strong>${esc(formatoFecha(d.programadoPara))}</strong></div></div>` : ''}

    ${d.cancelado || (PAGO && PAGO.esperandoPago) ? '' : `<div class="linea-tiempo">
      ${d.etapas.map(e => `<div class="etapa${e.cumplida ? ' cumplida' : ''}${e.actual ? ' actual' : ''}">
        <div class="etapa-nom">${esc(e.etiqueta)}</div>
        ${e.actual ? `<div class="etapa-sub">${esc(textoEtapa(e.clave, d.modalidad))}</div>` : ''}
      </div>`).join('')}
    </div>`}

    <div class="tarjeta">
      <h2>Tu pedido</h2>
      ${d.items.map(i => `<div class="item"><span>${i.cantidad}× ${esc(i.nombre)}</span></div>`).join('')}
      <div class="total"><span>Total</span><span>${dinero(d.total)}</span></div>
    </div>

    <div class="actualizado">Se actualiza solo · última revisión ${new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' })}</div>
    <div class="pie">Pedidos en línea con <strong>Xabor</strong></div>`;
}

function textoEtapa(clave, modalidad) {
  return ({
    recibido: 'Recibimos tu pago; el negocio ya tiene tu pedido',
    preparando: 'Están preparando tu pedido',
    listo: modalidad === 'domicilio' ? 'Listo, esperando repartidor' : 'Ya puedes pasar por él',
    en_camino: 'Tu pedido va en camino',
    entregado: 'Entregado',
  })[clave] || '';
}
function formatoFecha(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
}
cargar();
</script>
</body>
</html>
